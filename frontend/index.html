<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X431 Parser</title>
    <!-- Flatpickr for custom date format -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <style>
        :root {
            --primary: #ef4444;
            --primary-glow: rgba(239, 68, 68, 0.4);
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(239, 68, 68, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            animation: fadeIn 0.6s ease-out;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #f87171, #fb923c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-dim);
            font-size: 1.125rem;
        }

        .drop-zone {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px dashed var(--border);
            border-radius: 32px;
            padding: 2.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            --wails-drop-target: drop;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(30, 41, 59, 0.9);
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .drop-zone svg {
            width: 80px;
            height: 80px;
            color: var(--primary);
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }

        .drop-zone:hover svg {
            transform: translateY(-8px);
        }

        .drop-zone p {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .drop-zone span {
            color: var(--text-dim);
            font-size: 0.9375rem;
        }

        #statusMsg {
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            min-height: 4.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            line-height: 1.4;
        }

        .success {
            color: var(--success);
            background: rgba(34, 197, 94, 0.1) !important;
            border: 1px solid rgba(34, 197, 94, 0.2) !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
        }

        .error {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1) !important;
            border: 1px solid rgba(239, 68, 68, 0.2) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.1);
        }

        .loading {
            color: var(--primary);
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60% {
                content: '...';
            }

            80%,
            100% {
                content: '';
            }
        }

        .picker-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 1rem;
            animation: fadeIn 0.8s ease-out;
            align-items: stretch;
        }

        .mode-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="datetime-local"] {
            width: 220px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input[type="datetime-local"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .picker-label {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap;
        }

        #clearEndTime {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-dim);
            padding: 0.75rem 1.25rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        #clearEndTime:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--primary);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Calendar icon color override for dark theme */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.6;
        }

        ::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="container">
        <header class="header">
            <h1>X431 to Excel</h1>
        </header>

        <div class="picker-container">
            <div class="mode-option">
                <input type="radio" id="modeIncrement" name="mode" value="increment" checked>
                <label for="modeIncrement">Increment</label>
                <input type="number" id="incrementValue" min="1" value="1000">
                <label for="incrementValue">ms</label>
            </div>
            <div class="mode-option">
                <input type="radio" id="modeEndtime" name="mode" value="endtime">
                <label for="modeEndtime">End Time</label>
                <input type="datetime-local" id="endTimePicker" title="Set Resulting End Time" autocomplete="off">
                <button id="clearEndTime">Clear</button>
            </div>
        </div>

        <div class="drop-zone" id="dropZone">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
            </svg>
            <p>Drop .x431 or .dzx file here</p>
            <span>Excel file is saved to the same folder as input</span>
        </div>

        <div id="statusMsg">Ready to convert</div>
    </div>

    <!-- Wails JS -->
    <script src="./wailsjs/go/main/App.js"></script>
    <script src="./wailsjs/runtime/runtime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        const dropZone = document.getElementById('dropZone');
        const statusMsg = document.getElementById('statusMsg');
        const incrementRadio = document.getElementById('modeIncrement');
        const endtimeRadio = document.getElementById('modeEndtime');
        const incrementValueInput = document.getElementById('incrementValue');
        const endTimePicker = document.getElementById('endTimePicker');
        const clearBtn = document.getElementById('clearEndTime');

        // Initialize Flatpickr
        const fp = flatpickr(endTimePicker, {
            enableTime: true,
            enableSeconds: true,
            time_24hr: true,
            dateFormat: "Y/m/d H:i:S",
            defaultDate: new Date(),
            allowInput: true,
            monthSelectorType: 'static'
        });

        clearBtn.addEventListener('click', () => {
            fp.clear();
        });

        // Prevent default drag behaviors for the whole window
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop zone and ENABLE DROP
        dropZone.addEventListener('dragover', (e) => {
            preventDefaults(e); // CRITICAL: This enables the drop visually
            dropZone.classList.add('dragover');
        }, false);

        dropZone.addEventListener('dragenter', (e) => {
            preventDefaults(e);
            dropZone.classList.add('dragover');
        }, false);

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        // HANDLE NATIVE DRAG & DROP via Wails v2 OnFileDrop API
        // useDropTarget=true means only elements with --wails-drop-target CSS property will trigger the callback
        window.runtime.OnFileDrop(async (x, y, paths) => {
            console.log("File(s) dropped at:", x, y, "Paths:", paths);
            if (!paths || paths.length === 0) return;

            const validFiles = paths.filter(p => {
                const lower = p.toLowerCase();
                return lower.endsWith('.x431') || lower.endsWith('.dzx');
            });
            const skipped = paths.length - validFiles.length;

            if (validFiles.length === 0) {
                showStatus("Error: Only .x431 or .dzx files are supported.", 'error');
                return;
            }

            let succeeded = [];
            let failed = [];
            let modeValue = "";
            if (incrementRadio.checked) {
                const ms = incrementValueInput.value.trim();
                if (ms === "" || isNaN(ms) || parseInt(ms, 10) <= 0) {
                    modeValue = "increment:1000";
                } else {
                    modeValue = "increment:" + ms;
                }
            } else if (endtimeRadio.checked) {
                modeValue = endTimePicker.value;
            }
            // Clear picker immediately to avoid accidental reuse in separate drop
            endTimePicker.value = '';

            for (let i = 0; i < validFiles.length; i++) {
                const p = validFiles[i];
                const name = p.split(/[\\/]/).pop();
                showStatus(`Converting ${name} (${i + 1}/${validFiles.length})<span class='loading-dots'></span>`, 'loading');
                try {
                    let paramEndTime = "";
                    if (incrementRadio.checked) {
                        // For increment mode, pass the increment value to every file
                        paramEndTime = modeValue;
                    } else {
                        // For end time mode, only pass to the first file
                        paramEndTime = (i === 0) ? modeValue : "";
                    }
                    await window.go.main.App.ConvertX431ToXlsx(p, paramEndTime);
                    succeeded.push(name);
                } catch (err) {
                    console.error("Conversion failed for", p, err);
                    failed.push({ name, err });
                }
            }

            // Build summary message
            let parts = [];
            if (succeeded.length > 0) parts.push(`${succeeded.length} converted`);
            if (failed.length > 0) parts.push(`${failed.length} failed`);
            if (skipped > 0) parts.push(`${skipped} skipped`);

            const statusType = failed.length > 0 ? 'error' : 'success';
            if (validFiles.length === 1) {
                // Single file: show specific error if failed
                const msg = failed.length > 0
                    ? `Error: ${failed[0].err}`
                    : `Successfully converted ${succeeded[0]}`;
                showStatus(msg, statusType);
            } else {
                // Multi-file: show summary and the first error if any
                let msg = parts.join(', ');
                if (failed.length > 0) {
                    msg += `<br/><span style="font-size: 0.8em; opacity: 0.8">First error: ${failed[0].err}</span>`;
                }
                showStatus(msg, statusType);
            }
        }, true);

        function showStatus(msg, type) {
            statusMsg.innerHTML = msg;
            statusMsg.className = type || '';

            if (type === 'success') {
                setTimeout(() => {
                    if (statusMsg.className === 'success') {
                        statusMsg.innerHTML = 'Ready to convert';
                        statusMsg.className = '';
                    }
                }, 10000);
            }
        }
    </script>

</body>

</html>
